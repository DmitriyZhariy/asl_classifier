[project]
name = "asl"
version = "1.0.2"
description = "ASL classifier mini"
requires-python = ">=3.11,<3.13"

dependencies = [
    'fastapi',
    'uvicorn',
    'pydantic',
    'pydantic-settings',
    'numpy',
    'psycopg[binary]',
    'onnxruntime',
    'python-multipart',
    'pillow'
]


[dependency-groups]
dev = [
    'pytest',
    'httpx',
    'locust',
    'ruff'
]


[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asl"

[tool.pytest.ini_option]
testpaths = ["tests"]
addopts = "-q"
