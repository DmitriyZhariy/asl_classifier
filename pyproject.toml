[project]
name = "asl"
version = "1.0.0"
description = "ASL classifier mini"
requires-python = ">=3.11,<3.13"

dependencies = [
    'fastapi',
    'uvicorn',
    'pydantic',
    'pydantic-settings',
    'psycopg[binary]',
    'torch',
    'torchvision',
    'albumentations',
]


[dependency-groups]
dev = [
    'pytest',
    'httpx',
    'locust',
    'ruff'
]


[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asl"