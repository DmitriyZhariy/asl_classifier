[project]
name = "asl"
version = "1.0.4"
description = "ASL classifier mini"
requires-python = ">=3.11,<3.13"

dependencies = [
    'fastapi',
    'uvicorn',
    'pydantic',
    'pydantic-settings',
    'numpy',
    'psycopg[binary]',
    'onnxruntime',
    'python-multipart',
    'pillow',
    "mlflow-skinny>=3.16,<4",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=8",
]


[dependency-groups]
dev = [
    'pytest',
    'httpx',
    "locust",
    'ruff',
]

train = [
    'pandas',
    'torch',
    'torchvision',
    'albumentations',
    'tqdm',
    'onnx',
    'onnxscript',
]


[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asl"

[tool.pytest.ini_option]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration needs DB - URL in DATABASE_URL"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
