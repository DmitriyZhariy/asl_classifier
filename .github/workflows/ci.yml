name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: asl}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      
    env: 
      DATABASE_URL: postgresql://postgres:test@localhost:5432/asl

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref== 'refs/heads/main'
    runs-on: ubuntu-latest
    
    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER_LC}/asl-service/sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: "${{ env.IMAGE }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind}
    timeout-minutes: 10
    
    permissions: {contents: read, packages: read}

    env:
      KIND_CLUSTER: asl3
    steps:
      - uses: actions/checkout@v7
      - run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER_LC}/asl-service/sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      
      - uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: kind, kubectl and cluster access
        run: |
          B=~/.local/bin && mkdir -p $B && echo "$B" >> "$GITHUB_PATH"
          [ -x $B/kind ] || curl -sSLo $B/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          [ -x $B/kubectl ] || curl -sSLo $B/kubectl https://dl.k8s.io/v1.37.0/bin/linux/amd64/kubectl
          chmod +x $B/kind $B/kubectl
          $B/kind export kubeconfig --name "$KIND_CLUSTER" --internal
          $B/kubectl get nodes

      - name: image-cluster
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name ${KIND_CLUSTER}

      - name: get-secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic asl-secrets \
            --from-literal=POSTGRES_PASSWORD="${DB_PASSWORD}" \
            --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/asl" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: base
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout 180s
      
      - name: service
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/asl-service api="$IMAGE"
          kubectl rollout status deploy/asl-service --timeout 180s

      - name: generate-valid-image
        run: |
          pip install --quiet Pillow
          python -c "from PIL import Image; Image.new('RGB', (516,516), (255,0,0)).save('/tmp/valid_image.png')"
      
      - name: generate-invalid-image
        run: |
          head -c 100 /dev/urandom > /tmp/invalid_image.png

      - name: smoke
        run: |
          U="http://$KIND_CLUSTER-control-plane:30080"; H="Host: asl.localhost"

          curl --fail -s --retry 5 --retry-all-errors -H "$H" $U/health | tee health.json; echo
          grep -q '"model_name":"asl' health.json

          
          # --- 1 predict test ---

          curl --fail -s -X POST -H "$H" $U/v1/predict \
            -F 'file=@/tmp/valid_image.png;type=image/png' | tee pred.json; echo

          sleep 2

          RID=$(jq -r .request_id pred.json)

          VALID_RECORD=$(kubectl exec -i deploy/postgres -- psql -U postgres -d asl -tA << 'EOF'
            SELECT COUNT(*) 
            FROM predictions
            WHERE request_id = '$RID'
              AND ABS( 
                (SELECT SUM(value::numeric) FROM jsonb_each_text(all_probabilities)) - 1
              ) < 1e-5;
          EOF
          )

          echo "VALID_RECORD"=$VALID_RECORD

          if [ "$VALID_RECORD" -qx 1 ]; then
          echo "::error::prediction with status_code=200 and correct probabilities not found"
          exit 1
          fi

          # --- 2 predict test ---
          
          curl --fail -s -X POST -H "$H" $U/v1/predict \
            -F 'file=@/tmp/invalid_image.png;type=image/png' | tee pred.json; echo

          sleep 2

          RID=$(jq -r .request_id pred.json)

          INVALID_RECORD=$(kubectl exec -i deploy/postgres -- psql -U postgres -d asl -tA << 'EOF'
            SELECT COUNT(*)
            FROM predictions
            WHERE request_id = '$RID'
              AND status_code = 422;
          EOF
          )

          echo "INVALID_RECORD=$INVALID_RECORD"

          if [ "$INVALID_RECORD" -qx 1 ]; then
            echo "::error::prediction with status_code=422 for invalid image testing not found"
            exit 1
          fi

      - name: diagnostic
        if: failure()
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |
          kubectl get pods -o wide
          kubectl describe deploy/asl-service | tail -20
          kubectl logs deploy/asl-service --tail=30 || true

          kubectl describe pod -l app=postgres | tail -40
          kubectl logs -l app=postgres --previous --tail=50 || true
          kubectl logs -l app=postgres --tail=50 || true

          kubectl exec deploy/asl-service -- printenv DATABASE_URL